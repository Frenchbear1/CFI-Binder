<style>html{color-scheme:dark}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}
.homebar{max-width:1200px;margin:0 auto;padding-top:14px}
.homebar a{font:500 13px "IBM Plex Mono",ui-monospace,monospace;color:#8ea2a5;text-decoration:none;letter-spacing:.06em}
.homebar a:hover,.homebar a:focus-visible{color:#e4ece9}</style>

<style>
/* Layout: flow "wind tunnel" canvas on top, lesson strip on top, controls + readouts below. Single dark avionics look, matching the other sims. */
:root{
  --bg:#0a1014; --panel:#0f181c; --panel2:#0c1418; --line:#1f2f36; --ink:#e4ece9; --dim:#8ea2a5;
  --ref:#5ccfe3; --var:#ffb54a; --cmp:#ef7fd1; --warn:#e2574a; --ok:#7fd98a;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;padding-block:14px 40px;display:flex;flex-direction:column;gap:12px}
.hint{font-size:13.5px;color:var(--dim)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.stage{position:relative;padding:0;overflow:hidden}
#flow{display:block;width:100%;touch-action:none;cursor:crosshair}
.pop{position:absolute;left:50%;top:12px;transform:translateX(-50%);font:600 15px var(--f-mono);letter-spacing:.16em;padding:5px 14px;border-radius:6px;pointer-events:none;white-space:nowrap}
#popStall{background:var(--warn);color:#160806}
#popWarn{background:var(--var);color:#1a1004}
#popG{top:auto;bottom:12px;background:#2a1311;color:#ffb3aa;border:1px solid var(--warn);font-size:12.5px;letter-spacing:.1em}
.probe{position:absolute;width:230px;background:rgba(9,16,19,.96);border:1px solid #33505a;border-radius:8px;padding:8px 10px 10px;pointer-events:auto;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.probe .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.probe .ph button{background:none;border:0;color:var(--dim);font:16px var(--f-mono);cursor:pointer;padding:0 2px;line-height:1}
.probe .pt{font:600 19px var(--f-display);line-height:1.1;margin:2px 0 4px;white-space:nowrap}
.probe canvas{display:block;width:100%;height:150px}
.probe .pr{display:flex;justify-content:space-between;font:12px var(--f-mono);color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.probe .pr b{color:var(--ink);font-weight:500}

.lesson{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px;align-items:start}
.lesson-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;grid-column:1/-1}
#stepNum{font-family:var(--f-mono);font-size:12px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:22px;height:6px;border-radius:3px;border:0;background:var(--line);padding:0;cursor:pointer}
.dots button.on{background:var(--ink)} .dots button.done{background:#4d6268}
.dots button:focus-visible{outline:2px solid var(--ref);outline-offset:3px}
.lesson-text{min-width:0}
#stepTitle{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.1;margin:2px 0 4px;text-wrap:balance}
#stepBody{margin:0;max-width:72ch;min-height:4.5em}
#stepBody b.l{color:var(--ref);font-weight:600} #stepBody b.t{color:var(--var);font-weight:600} #stepBody b.s{color:var(--warn);font-weight:600} #stepBody b.g{color:var(--ok);font-weight:600} #stepBody b.d{color:var(--cmp);font-weight:600}
.bar{grid-column:1/-1;height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
#stepBar{height:100%;width:0;background:var(--dim)}
.lctl{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button.b{font:500 13px var(--f-body);color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer;min-height:34px}
button.b:hover{border-color:#3d545c} button.b:focus-visible{outline:2px solid var(--ref);outline-offset:2px}
button.b.primary{background:var(--ink);color:#0a1014;border-color:var(--ink);min-width:84px}
button.b:disabled{opacity:.4;cursor:default}
.speed{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.speed input{width:120px;accent-color:var(--ink);height:auto}
#speedTxt{min-width:4ch}
@media (max-width:480px){.dots button{width:14px}}
@media (max-width:760px){.lesson{grid-template-columns:minmax(0,1fr)}.lctl{align-items:stretch}.btns{justify-content:flex-start}}
.deck{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;align-items:stretch}
@media (max-width:640px){.deck{grid-template-columns:minmax(0,1fr)}}
.ctl{display:flex;flex-direction:column;gap:14px}
.sl{display:flex;flex-direction:column;gap:4px}
.sl .h{display:flex;justify-content:space-between;align-items:baseline}
.lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.sl output{font:600 22px var(--f-display);font-variant-numeric:tabular-nums;min-width:4.5ch;text-align:right}
input[type=range]{width:100%;accent-color:var(--ink);margin:0;height:26px}
.tg{display:flex;gap:6px;flex-wrap:wrap}
.tg button{font:500 13px var(--f-body);color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer;min-height:34px}
.tg button[aria-pressed=true]{color:var(--ink);border-color:#4d6a73;background:#14232a}
.tg button:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--ref);outline-offset:2px}
.tg button.reset{margin-left:auto}
.ro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;align-content:start}
.ro>div{display:flex;flex-direction:column;min-width:0}
.ro strong{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro strong small{font-size:15px;color:var(--dim);font-weight:500;margin-left:3px}
.warnc{color:var(--warn)!important} .ambc{color:var(--var)!important}

<body>
<div class="homebar"><a href="../index.html">← All simulations</a></div>
<div class="wrap">
  <section class="lesson" aria-live="polite">
    <div class="lesson-meta"><span id="stepNum">Step 1 of 12</span><div class="dots" id="dots" role="tablist" aria-label="Lesson steps"></div></div>
    <div class="lesson-text">
      <h2 id="stepTitle"></h2>
      <p id="stepBody"></p>
    </div>
    <div class="lctl">
      <div class="btns">
        <button class="b" id="prev" type="button">◀ Back</button>
        <button class="b primary" id="play" type="button">Pause</button>

      </div>

    </div>
    <div class="bar"><div id="stepBar"></div></div>
  </section>

  <div class="panel stage" id="stage">
    <canvas id="flow" aria-label="Airflow around a NACA 2412 airfoil"></canvas>
    <div class="pop" id="popStall" hidden>STALL</div>
    <div class="pop" id="popWarn" hidden>STALL WARNING</div>
    <div class="probe" id="probe" hidden>
      <div class="ph"><span id="pbWhere">Upper · 40% chord</span><button id="pbClose" aria-label="Close">×</button></div>
      <div class="pt" id="pbType">Laminar</div>
      <canvas id="pbCv"></canvas>
      <div class="pr"><span>Thickness <b id="pbD">0.0 mm</b></span><span>H <b id="pbH">2.59</b></span></div>
      <div class="pr"><span>Edge <b id="pbU">1.00 V∞</b></span><b id="pbG">Pressure falling</b></div>
    </div>
  </div>

  <div class="deck">
    <div class="panel ctl">
      <div class="sl"><div class="h"><label class="lab" for="aoa">Angle of attack</label><output id="aoaOut">4.0°</output></div>
        <input id="aoa" type="range" min="-6" max="22" step="0.1" value="4"></div>
      <div class="tg">
        <button id="tP" aria-pressed="false">Pressure</button>
        <button id="tB" aria-pressed="true">Boundary layer</button>
        <button id="tF" aria-pressed="true">Forces</button>
        <button id="tS" aria-pressed="false">Slow motion</button>
      </div>
    </div>
    <div class="panel ro">
      <div><span class="lab">Lift coeff.</span><strong id="rCL">0.65</strong></div>
      <div><span class="lab">Lift / drag</span><strong id="rLD">95</strong></div>
      <div><span class="lab">Level-flight speed</span><strong id="rV">77<small>KIAS</small></strong></div>
      <div><span class="lab">Reynolds no.</span><strong id="rRe">3.6<small>M</small></strong></div>
    </div>
  </div>
</div>

<script src="kit.js"></script>
<script>
"use strict";
/* ================= Physics =================
   Geometry: NACA 2412 (Cessna 172 wing section), chord 1.47 m.
   Inviscid flow: Hess-Smith source + vortex panel method with Kutta condition (exact potential flow around the real shape).
   Viscous: Thwaites laminar BL, Michel transition (or laminar separation), Head turbulent BL, Squire-Young drag.
   Separation/stall: Kirchhoff-Beddoes-Leishman separation point f(α) calibrated to NACA 2412 data
   (a≈0.106/deg, α0≈-2.1°, cl,max≈1.68 near 16°, Abbott & von Doenhoff, Re≈6M).
   Aircraft: C172S, Vs1 48 KIAS (max weight, flaps up), limit load +3.8 G.  */
const CHORD_M=1.47, NU_AIR=1.46e-5, VS1=48, VNE=163, NLIM=3.8;
const A_SLOPE=0.106, A_ZERO=-2.1, BL_A1=16.6, BL_S1=3, BL_S2=2;
const PANELS_PER_SIDE=70;

function naca4(M,m=0.02,p=0.4,t=0.12){
  const pt=x=>{const yt=5*t*(0.2969*Math.sqrt(x)-0.1260*x-0.3516*x*x+0.2843*x*x*x-0.1036*x*x*x*x);
    let yc,dy;if(x<p){yc=m/(p*p)*(2*p*x-x*x);dy=2*m/(p*p)*(p-x);}else{yc=m/((1-p)*(1-p))*((1-2*p)+2*p*x-x*x);dy=2*m/((1-p)*(1-p))*(p-x);}
    const th=Math.atan(dy);return{xu:x-yt*Math.sin(th),yu:yc+yt*Math.cos(th),xl:x+yt*Math.sin(th),yl:yc-yt*Math.cos(th)};};
  const xs=[];for(let i=0;i<=M;i++)xs.push(0.5*(1-Math.cos(Math.PI*i/M)));
  const X=[],Y=[];
  for(let i=M;i>=0;i--){const q=pt(xs[i]);X.push(q.xl);Y.push(q.yl);}
  for(let i=1;i<=M;i++){const q=pt(xs[i]);X.push(q.xu);Y.push(q.yu);}
  X[2*M]=X[0];Y[2*M]=Y[0];return{X,Y};
}
function infl(pn,px,py,self){
  const dx=px-pn.x0,dy=py-pn.y0,xi=dx*pn.tx+dy*pn.ty,eta=dx*pn.nx+dy*pn.ny;
  const r1=xi*xi+eta*eta,r2=(xi-pn.l)*(xi-pn.l)+eta*eta;
  const lnr=0.25*Math.log(r1/r2)/Math.PI;
  const b=(self?Math.PI:(Math.atan2(eta,xi-pn.l)-Math.atan2(eta,xi)))/(2*Math.PI);
  return[lnr*pn.tx+b*pn.nx,lnr*pn.ty+b*pn.ny,-b*pn.tx+lnr*pn.nx,-b*pn.ty+lnr*pn.ny];
}
function gauss(A,bs){const n=A.length;A=A.map(r=>r.slice());bs=bs.map(b=>b.slice());
  for(let k=0;k<n;k++){let p=k;for(let i=k+1;i<n;i++)if(Math.abs(A[i][k])>Math.abs(A[p][k]))p=i;
    [A[k],A[p]]=[A[p],A[k]];for(const b of bs)[b[k],b[p]]=[b[p],b[k]];
    for(let i=k+1;i<n;i++){const f=A[i][k]/A[k][k];if(!f)continue;for(let j=k;j<n;j++)A[i][j]-=f*A[k][j];for(const b of bs)b[i]-=f*b[k];}}
  for(const b of bs)for(let i=n-1;i>=0;i--){let s=b[i];for(let j=i+1;j<n;j++)s-=A[i][j]*b[j];b[i]=s/A[i][i];}
  return bs;}

const M=PANELS_PER_SIDE;
const G=(()=>{const{X,Y}=naca4(M);const P=[];
  for(let j=0;j<X.length-1;j++){const dx=X[j+1]-X[j],dy=Y[j+1]-Y[j],l=Math.hypot(dx,dy),tx=dx/l,ty=dy/l;
    P.push({x0:X[j],y0:Y[j],l,tx,ty,nx:-ty,ny:tx,cx:(X[j]+X[j+1])/2,cy:(Y[j]+Y[j+1])/2});}
  const N=P.length,An=[],At=[],Bn=new Array(N).fill(0),Bt=new Array(N).fill(0);
  for(let i=0;i<N;i++){An.push(new Array(N));At.push(new Array(N));const pi=P[i];
    for(let j=0;j<N;j++){const f=infl(P[j],pi.cx,pi.cy,i===j);
      An[i][j]=f[0]*pi.nx+f[1]*pi.ny;At[i][j]=f[0]*pi.tx+f[1]*pi.ty;Bn[i]+=f[2]*pi.nx+f[3]*pi.ny;Bt[i]+=f[2]*pi.tx+f[3]*pi.ty;}}
  const[qx,qy,qc]=gauss(An,[P.map(p=>-p.nx),P.map(p=>-p.ny),Bn.map(v=>-v)]);
  const vt=(q,ux,uy,g)=>P.map((p,i)=>{let s=ux*p.tx+uy*p.ty+g*Bt[i];for(let j=0;j<N;j++)s+=q[j]*At[i][j];return s;});
  return{X,Y,P,N,qx,qy,qc,Vx:vt(qx,1,0,0),Vy:vt(qy,0,1,0),Vc:vt(qc,0,0,1),per:P.reduce((s,p)=>s+p.l,0)};})();
function gammaKutta(a){const N=G.N,ca=Math.cos(a),sa=Math.sin(a);return-(ca*(G.Vx[0]+G.Vx[N-1])+sa*(G.Vy[0]+G.Vy[N-1]))/(G.Vc[0]+G.Vc[N-1]);}
function fieldAt(px,py){let a=1,b=0,c=0,d=1,e=0,f=0;const P=G.P;
  for(let j=0;j<G.N;j++){const g=infl(P[j],px,py,false);a+=G.qx[j]*g[0];b+=G.qx[j]*g[1];c+=G.qy[j]*g[0];d+=G.qy[j]*g[1];e+=G.qc[j]*g[0]+g[2];f+=G.qc[j]*g[1]+g[3];}
  return[a,b,c,d,e,f];}

// separation point (fraction of chord, upper surface) and section coefficients
function sepF(ad){return ad<=BL_A1?1-0.3*Math.exp((ad-BL_A1)/BL_S1):0.04+0.66*Math.exp((BL_A1-ad)/BL_S2);}
function clOf(ad){const r=Math.sqrt(sepF(ad));return A_SLOPE*(ad-A_ZERO)*((1+r)/2)**2;}
let A_CRIT=0,CL_MAX=0;for(let a=8;a<=22;a+=0.01){const c=clOf(a);if(c>CL_MAX){CL_MAX=c;A_CRIT=a;}}

// geometry lookup tables (body frame): upper panels M..N-1 (x increasing), lower panels M-1..0 (x increasing)
const UP=[],LO=[];for(let i=M;i<G.N;i++)UP.push(i);for(let i=M-1;i>=0;i--)LO.push(i);
function surfIdx(list,x){let lo=0,hi=list.length-1;const P=G.P;if(x<=P[list[0]].cx)return 0;if(x>=P[list[hi]].cx)return hi;
  while(hi-lo>1){const m=(lo+hi)>>1;if(P[list[m]].cx<x)lo=m;else hi=m;}return(x-P[list[lo]].cx)<(P[list[hi]].cx-x)?lo:hi;}
function surfY(upper,x){ // y on surface at body x by node interpolation
  const X=G.X,Y=G.Y;if(upper){for(let i=M;i<2*M;i++)if(X[i+1]>=x){const t=(x-X[i])/(X[i+1]-X[i]||1);return Y[i]+t*(Y[i+1]-Y[i]);}return Y[2*M];}
  for(let i=M;i>0;i--)if(X[i-1]>=x){const t=(x-X[i])/(X[i-1]-X[i]||1);return Y[i]+t*(Y[i-1]-Y[i]);}return Y[0];}
const YT=new Float32Array(1001),YB=new Float32Array(1001);for(let i=0;i<=1000;i++){YT[i]=surfY(true,i/1000);YB[i]=surfY(false,i/1000);}
function inBody(bx,by){if(bx<0||bx>1)return false;const k=Math.min(999,(bx*1000)|0),t=bx*1000-k;
  return by<YT[k]+(YT[k+1]-YT[k])*t&&by>YB[k]+(YB[k+1]-YB[k])*t;}

// ---- boundary layer on one side ----
function blSurface(s,ue,x,Re){
  const n=s.length,nu=1/Re,out=[];let I=0,turb=false,th=0,H=2.6,H1=0,tr=-1;
  const inv=h1=>h1<5.3?0.6778+1.1538*Math.pow(Math.max(h1-3.3,1e-3),-0.326):1.1+0.86*Math.pow(h1-3.3,-0.777);
  const rhs=(t_,H_,H1_,U_,dU)=>{const R=Math.max(U_*t_*Re,50),cf=0.246*Math.pow(10,-0.678*H_)*Math.pow(R,-0.268);
    return[cf/2-(H_+2)*t_/U_*dU,U_*0.0306*Math.pow(Math.max(H1_-3,0.01),-0.6169)];};
  for(let i=0;i<n;i++){
    const U=Math.max(ue[i],1e-4),dUds=i>0?(ue[i]-ue[i-1])/Math.max(s[i]-s[i-1],1e-9):ue[0]/Math.max(s[0],1e-9);
    if(!turb){
      if(i>0)I+=0.5*(Math.pow(Math.max(ue[i-1],0),5)+Math.pow(U,5))*(s[i]-s[i-1]);else I=Math.pow(U,5)*s[0]/6;
      th=Math.sqrt(0.45*nu*I/Math.pow(U,6));
      const lr=th*th/nu*dUds,lam=Math.max(-0.09,Math.min(0.25,lr)),z=0.25-lam;
      H=2.0+4.14*z-83.5*z*z+854*z*z*z-3337*z**4+4576*z**5;
      const Rth=U*th*Re,Rx=Math.max(U*s[i]*Re,1);
      if((i>2&&Rth>1.174*(1+22400/Rx)*Math.pow(Rx,0.46))||lr<-0.09){turb=true;tr=i;H=1.4;H1=3.3+0.8234*Math.pow(0.3,-1.287);}
      out.push({th,H,lam,turb:false});
    }else{
      const ds=s[i]-s[i-1],Up=Math.max(ue[i-1],1e-4),thp=th,Hp=H,H1p=H1;
      const k1=rhs(thp,Hp,H1p,Up,dUds);let t2=Math.max(thp+ds*k1[0],1e-6),E=Up*thp*H1p+ds*k1[1];
      const H12=Math.max(3.31,E/(U*t2)),k2=rhs(t2,inv(H12),H12,U,dUds);
      th=Math.max(thp+ds*0.5*(k1[0]+k2[0]),1e-6);E=Up*thp*H1p+ds*0.5*(k1[1]+k2[1]);
      H1=Math.max(3.31,E/(U*th));H=Math.min(inv(H1),3.5);out.push({th,H,lam:0,turb:true});
    }
  }
  for(const o of out)o.d=o.turb?o.th*(3.15+1.72/Math.max(o.H-1,0.05))+o.H*o.th:o.th*o.H*2.9;
  return{pts:out,tr};
}

// ================= State =================
const S={aT:4,a:4,bank:0,bankT:0,showP:false,showBL:true,showF:true,slow:false,
  f:1,gam:0,CL:0,CD:0,n:1,V:0,Re:5e6,stag:{x:0,y:0},tr:{up:null,lo:null},sepX:1,
  bl:new Array(G.N).fill(null),vt:new Float64Array(G.N),cpSep:0,teD:0.01};

function solveState(){
  const ad=S.a,a=ad*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a);
  S.f=Math.min(1,sepF(ad));S.n=1/Math.cos(S.bank*Math.PI/180);
  S.CL=clOf(ad);
  S.gam=gammaKutta(a)*(1-0.14*Math.min(1,Math.max(0,(0.975-S.f)/0.35)));
  for(let i=0;i<G.N;i++)S.vt[i]=ca*G.Vx[i]+sa*G.Vy[i]+S.gam*G.Vc[i];
  // airspeed to hold level flight at this AoA, 1 G (KIAS) -> Reynolds number
  S.V=S.CL>0.02?VS1*Math.sqrt(S.n)*Math.sqrt(CL_MAX/S.CL):Infinity;

<li>At the stagnation point local speed is zero and pressure rises by the full <b>dynamic pressure</b>: <span class="k">q = ½ρV²</span>.</li>
<li>Your <b>pitot tube</b> is a stagnation point. The airspeed indicator reads total − static pressure = q, which is why it shows <b>indicated</b> airspeed, not true airspeed.</li>
<li>As AOA rises the stagnation point slides down and aft under the leading edge. Stall-warning reeds and vanes sit just there to sense it.</li></ul>`},
{refs:['phak4','nasaWrong'],more:`<ul>
<li>The "equal transit time" idea (top and bottom air must meet at the trailing edge) is <b>false</b>. Upper-surface air arrives much earlier.</li>
<li>Path length doesn't make lift: a flat plate or a cambered sail has equal paths and still lifts when it meets the air at an angle.</li></ul>`},
{refs:['phak4','nasaBern'],more:`<ul>
<li>Along a streamline: <span class="k">p + ½ρV² = constant</span> (valid for low-speed, incompressible flow, below about Mach 0.3).</li>
<li>Pressure is shown as <b>Cp</b>; the strongest suction is near the front of the upper surface, which is why leading-edge contamination hurts so much.</li>
<li>The <b>center of pressure</b> of a cambered airfoil moves forward as AOA rises and aft as it drops. That shifting is one reason a tail is needed for stability.</li></ul>`},
{refs:['phak5','acsI_F'],more:`<ul>
<li><span class="k">L = C<sub>L</sub> · ½ρV² · S</span> &nbsp; <span class="k">D = C<sub>D</sub> · ½ρV² · S</span></li>
<li>At constant lift (level flight), slower means higher C<sub>L</sub>, which means higher AOA.</li>
<li>Section L/D (this 2-D slice) is far higher than the whole airplane's. A 172 glides at roughly <span class="k">9:1</span> because of parasite and induced drag.</li>
<li>Max L/D occurs at one AOA: that is <b>best glide speed</b> (68 KIAS in a C172S at max weight; lower when lighter).</li></ul>`},
{refs:['phak4','phak5','nasaBern'],more:`<ul>
<li>On a real wing, downwash and high-pressure air curling around the tips form <b>wingtip vortices</b>. They tilt the lift vector aft: that rearward part is <b>induced drag</b>.</li>
<li>Induced drag is greatest at <b>high AOA / low speed</b>; parasite drag grows with speed. Their sum is lowest at L/D<sub>max</sub>.</li>
<li><b>Ground effect:</b> within about one wingspan of the ground (strongest under half a span), the ground limits downwash, reducing induced drag. This can make an airplane float or lift off before it can climb.</li>
<li>The same vortices are <b>wake turbulence</b>, strongest behind heavy, clean, slow airplanes.</li></ul>`},
{refs:['phak4','afh2','aim7'],more:`<ul>
<li>Thickness here is a few millimetres. Its behavior is set by the <b>Reynolds number</b> <span class="k">Re = V·c / ν</span> (about 3–4 million for a 172 in cruise).</li>
<li>Skin friction from this layer is part of <b>parasite drag</b>.</li>
<li>Frost, ice, bugs and rough paint trip and thicken the layer, raising drag and lowering C<sub>L,max</sub>, so the wing stalls at a <b>lower AOA</b> and higher speed. Remove all frost before takeoff.</li></ul>`},
{refs:['phak4','airfoiltools'],more:`<ul>
<li>Transition is triggered by rising pressure (adverse gradient), roughness and higher Re. On this section it sits near the suction peak and moves forward with AOA.</li>
<li>Turbulent layers cause more friction but carry more energy near the wall, so they <b>resist separation</b> better. Vortex generators use this deliberately.</li>
<li>Laminar-flow airfoils delay transition for lower drag but are more sensitive to bugs and rain.</li></ul>`},
{refs:['phak5','airfoiltools'],more:`<ul>
<li>Section lift slope ≈ <span class="k">0.1 C<sub>L</sub>/deg</span> (2π per radian in theory). A finite wing's slope is lower because of downwash: about 0.08/deg for a 172-like aspect ratio.</li>
<li>Zero-lift AOA is about <span class="k">−2°</span>: camber makes lift at 0°.</li>
<li><b>Flaps</b> add camber: more C<sub>L</sub> at a given AOA and a higher C<sub>L,max</sub>, but a slightly <b>lower</b> critical AOA and more drag.</li></ul>`},
{refs:['phak5','afh5','acsVII'],more:`<ul>
<li>Thick sections like the 2412 stall from the <b>trailing edge forward</b>: gentle, with buffet first. Thin sections can stall abruptly from the leading edge.</li>
<li>The 172 wing has <b>washout</b> (twist, tip at a lower incidence) so the root stalls first and the ailerons keep working.</li>
<li>Warning cues: stall horn or light, mushy controls, buffet, high pitch with decaying speed. Respond to the first cue.</li></ul>`},
{refs:['phak5','afh5','acsVII'],more:`<ul>
<li>Stall speed changes; critical AOA doesn't. Vs rises with <b>weight</b> (∝√W), <b>load factor</b> (∝√n: ×1.41 at 60° bank), <b>forward CG</b> (more tail download) and ice. Power and flaps lower it.</li>
<li><b>Accelerated stall:</b> a stall above the published Vs, from a pull or a steep turn. Common in base-to-final turns.</li>
<li>C172S: Vs1 <span class="k">48 KIAS</span> (clean), Vso <span class="k">40 KIAS</span> (flaps 30°), max weight. Use your POH.</li></ul>`},
{refs:['afh5','acsVII','phak5'],more:`<ul>
<li>AFH recovery order: <b>1</b> pitch nose-down to reduce AOA until the warning stops, <b>2</b> roll wings level, <b>3</b> add power as needed, <b>4</b> return to the desired flight path. AOA first, always.</li>
<li>Stall + yaw (uncoordinated) can become a <b>spin</b>. Keep the ball centred near the stall.</li>
<li>ACS PA.VII.A slow flight: altitude <span class="k">±100 ft</span>, heading <span class="k">±10°</span>, airspeed <span class="k">+10/−0 kt</span>, bank <span class="k">±10°</span>, no stall warning. PA.VII.B/C: recognize and recover promptly from power-off and power-on stalls.</li></ul>`},
{refs:['phak4','phak5','afh5','acsI_F','acsVII'],more:`<ul>
<li>Find the AOA where separation leaves the trailing edge (start of the stall break) and where C<sub>L</sub> peaks.</li>
<li>Compare L/D at 2°, 4° and 8°: max L/D is not at max lift.</li>
<li>Model: 2-D section, low speed, clean leaf. A real 3-D wing has lower slope, lower C<sub>L,max</sub> and root-first stall from washout.</li></ul>`},
];
STEPS.forEach((s,i)=>Object.assign(s,DEEP[i]||{}));
const L_={step:0,t:0,mode:'tour',playing:true,speed:1};
$('speed').addEventListener('input',e=>{L_.speed=+e.target.value;$('speedTxt').textContent=L_.speed+'×';});
const dotsEl=$('dots');
STEPS.forEach((st,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Step '+(i+1)+': '+st.title);b.onclick=()=>goStep(i,true);dotsEl.appendChild(b);});
function probeAt(upper,x){const list=upper?UP:LO;probe={i:list[surfIdx(list,x)]};pb.hidden=false;updateProbe();}
function stepA(st,t){if(st.a===null)return null;if(typeof st.a==='number')return st.a;const[a0,a1,t0,t1]=st.a,k=Math.max(0,Math.min(1,(t-t0)/(t1-t0)));return a0+(a1-a0)*k*k*(3-2*k);}
function goStep(i,manual,keep){
  i=Math.max(0,Math.min(STEPS.length-1,i));L_.step=i;L_.t=0;const st=STEPS[i];
  L_.mode=i===STEPS.length-1?'explore':'tour';
  $('stepNum').textContent='Step '+(i+1)+' of '+STEPS.length;$('stepTitle').textContent=st.title;$('stepBody').innerHTML=st.body;
  [...dotsEl.children].forEach((b,k)=>{b.className=k===i?'on':(k<i?'done':'');b.setAttribute('aria-current',k===i?'step':'false');});
  $('explore').hidden=L_.mode==='explore';Kit.step(st);$('next').disabled=i===STEPS.length-1;$('prev').disabled=i===0;
  if(L_.mode==='explore'){S.markStag=false;S.wash=false;if(!keep){setTog('tP','showP',false);setTog('tB','showBL',true);setTog('tF','showF',true);setTog('tS','slow',false);probe=null;pb.hidden=true;}return;}
  setTog('tP','showP',!!st.P);setTog('tB','showBL',!!st.B);setTog('tF','showF',!!st.F);setTog('tS','slow',!!st.slow);S.markStag=!!st.stag;S.wash=!!st.wash;
  S.aT=stepA(st,0);$('aoa').value=S.aT;
  if(st.probe)probeAt(st.probe[0],st.probe[1]);else{probe=null;pb.hidden=true;}
  dirty=true;}
function lessonTick(dt){const st=STEPS[L_.step];
  if(L_.mode==='tour'&&L_.playing){L_.t+=dt*L_.speed;const a=stepA(st,L_.t);if(a!==null&&Math.abs(a-S.aT)>1e-4){S.aT=a;$('aoa').value=a;}
    if(st.probe&&probe)updateProbe();
    if(st.dur&&L_.t>=st.dur)goStep(L_.step+1);}
  $('stepBar').style.width=(st.dur?Math.min(1,L_.t/st.dur)*100:100)+'%';}
$('prev').onclick=()=>goStep(L_.step-1,true);$('next').onclick=()=>goStep(L_.step+1,true);
$('explore').onclick=()=>goStep(STEPS.length-1,true);
function setPlay(v){L_.playing=v;$('play').textContent=v?'Pause':'Play';}
$('play').onclick=()=>setPlay(!L_.playing);
Kit.mount({pause:()=>setPlay(false),sources:['phak4','phak5','phak8','afh2','afh5','aim7','acsI_F','acsVII','nasaWrong','nasaBern','airfoiltools']});
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){L_.playing=false;$('play').textContent='Play';}

// ================= Loop =================
let moving=true,lastT=performance.now(),dirty=true;
function frame(now){
  const rdt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  lessonTick(rdt);
  const da=S.aT-S.a;moving=Math.abs(da)>0.005;
  if(moving||dirty){S.a+=Math.abs(da)<0.005?da:da*Math.min(1,rdt*7*Math.max(1,L_.speed));
    setRot();solveState();buildZone();readouts();if(probe)updateProbe();pressDirty=true;dirty=false;}
  if(gridReady&&L_.playing){const rate=(S.slow?0.12:0.42)*L_.speed,dt=rdt*rate,n=2;for(let k=0;k<n;k++){simT+=dt/n;stepSmoke(dt/n);}}
  draw();
  requestAnimationFrame(frame);}
const ro=new ResizeObserver(()=>{resize();dirty=true;});ro.observe($('stage'));
resize();goStep(0);setRot();solveState();buildZone();readouts();requestAnimationFrame(frame);
</script>
