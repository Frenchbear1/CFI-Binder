<div class="homebar"></div>

<div class="wrap">
  <section class="lesson" aria-live="polite">
    <div class="lesson-meta"><span id="stepNum">Step 1</span><div class="dots" id="dots" role="tablist" aria-label="Lesson steps"></div></div>
    <div class="lesson-text">
      <h2 id="stepTitle">The flight and the clock</h2>
      <p id="stepBody"></p>
    </div>
    <div class="ctl">
      <div class="btns">
        <button class="b" id="prev" type="button">◀ Back</button>
        <button class="b primary" id="play" type="button">Pause</button>
        <button class="b" id="next" type="button">Next ▶</button>
        <button class="b" id="explore" type="button">Explore freely</button>
      </div>
      <label class="speed" for="speed">Speed <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"> <span id="speedTxt">1×</span></label>
    </div>
    <div class="bar"><div id="stepBar"></div></div>
  </section>

  <main class="stage">
    <div class="col">
      <div class="panel">
        <div class="plabel"><span>Route · KSPI → KIND</span><span>Synthetic training weather · 14 Jun</span></div>
        <canvas id="map" aria-label="Map of the route from Springfield to Indianapolis with airports colored by flight category, advisories, radar and the aircraft"></canvas>
        <div class="lay" id="lay">
          <button class="tg" type="button" data-l="adv" aria-pressed="true">Advisories</button>
          <button class="tg" type="button" data-l="radar" aria-pressed="true">Radar</button>
          <button class="tg" type="button" data-l="lag" aria-pressed="false">Datalink age</button>
          <button class="tg" type="button" data-l="pirep" aria-pressed="true">PIREPs</button>
          <button class="tg" type="button" data-l="front" aria-pressed="true">Front</button>
        </div>
      </div>
      <div class="panel">
        <div class="plabel"><span>What is known at the clock time</span><span>issue → valid</span></div>
        <canvas id="tl" aria-label="Timeline of observations, forecasts, advisories and the flight, in UTC"></canvas>
      </div>
    </div>
    <div class="col">
      <div class="panel">
        <div class="plabel"><span>Products</span><span>tap a code to decode it</span></div>
        <div class="tabs" id="tabs" role="tablist"></div>
        <div id="plist"></div>
        <div id="dec" aria-live="polite"></div>
      </div>
      <div class="panel">
        <div class="plabel"><span>Flight</span><span>VFR · 115 kt TAS</span></div>
        <div class="ro">
          <span>Clock</span><strong id="roClock">1400Z</strong>
          <span>Plan</span><strong id="roPlan"></strong>
          <span>KSPI</span><strong id="roDep"></strong>
          <span>En route</span><strong id="roRte"></strong>
          <span id="roDstL">KIND</span><strong id="roDst"></strong>
        </div>
        <div class="ctrls">
          <label for="clk">Clock</label><input id="clk" type="range" min="11" max="20" step="0.0166667" value="14"><button class="b" id="run" type="button" style="padding:4px 10px;min-height:30px">▶ Run</button>
          <label for="dep">Depart</label><input id="dep" type="range" min="13" max="19" step="0.25" value="15.5"><output id="depTxt">1530Z</output>
          <label for="alt">Cruise</label><select id="alt"><option value="3500">3,500 ft</option><option value="5500" selected>5,500 ft</option><option value="7500">7,500 ft</option></select><span></span>
        </div>
        <div class="dec" id="decBtns"></div>
        <div id="fb"></div>
      </div>
    </div>
  </main>
</div>
