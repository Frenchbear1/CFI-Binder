name: Old GitHub Pages address forwards to the binder

# The binder itself now lives on Vercel (cfi-binder-coral.vercel.app), which builds on every push.
# GitHub Pages no longer has a copy of the binder: it only serves a small page that sends the old address
# (and any old link to a lesson) to the same page on Vercel.
on:
  push:
    branches: [main]
    paths: ['.github/pages-redirect/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp .github/pages-redirect/index.html .github/pages-redirect/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
