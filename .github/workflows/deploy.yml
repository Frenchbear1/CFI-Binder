name: Build and publish the binder

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'   # every Monday morning: check the FAA for new editions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Keep last run's downloads so unchanged handbooks aren't downloaded again.
      - uses: actions/cache@v4
        with:
          path: public/library
          key: library-${{ github.run_id }}
          restore-keys: library-
      - name: Download the latest handbooks and index their text
        run: node scripts/fetch-sources.mjs
        env:
          WEB_DEBUG: "1"
      - name: Check video stats (views, likes, comments, channel)
        run: node scripts/video-stats.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Build
        run: npm run build
        env:
          SITE: https://${{ github.repository_owner }}.github.io
          BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
